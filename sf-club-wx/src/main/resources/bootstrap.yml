spring:
  application:
    name: sf-club-wx
  profiles:
    active: @profile.active@
  cloud:
    nacos:
      config:
        server-addr: @nacos.addr@
        prefix: ${spring.application.name}
        group: DEFAULT_GROUP
        file-extension: yaml
      discovery:
        enabled: true
        server-addr: @nacos.addr@
