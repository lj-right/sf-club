server:
  port: 5000
spring:
  profiles:
    active: @profile.active@
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # 全局跨域支持 (CORS)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: oss
          uri: lb://sf-club-oss
          predicates:
            - Path=/oss/**
          filters:
            - StripPrefix=1
        - id: auth
          uri: lb://sf-club-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: subject
          uri: lb://sf-club-subject
          predicates:
            - Path=/subject/**
          filters:
            - StripPrefix=1
        - id: wx
          uri: lb://sf-club-wx
          predicates:
            - Path=/wx/**
          filters:
            - StripPrefix=1
        - id: practice
          uri: lb://sf-club-practice
          predicates:
            - Path=/practice/**
          filters:
            - StripPrefix=1
        - id: circle
          uri: lb://sf-club-circle
          predicates:
            - Path=/circle/**
          filters:
            - StripPrefix=1
        - id: interview
          uri: lb://sf-club-interview
          predicates:
            - Path=/interview/**
          filters:
            - StripPrefix=1
        - id: ai
          uri: http://127.0.0.1:8012
          predicates:
            - Path=/ai/**
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: random-32
  is-log: true
